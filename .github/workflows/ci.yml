name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  docs:
    name: Legal documentation languages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated legal documents
        run: node docs/generate-legal.mjs --check

      - name: Check legal language coverage and routing
        run: node --test docs/legal-documents.test.mjs

  api:
    name: API build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Build API
        run: npm run build

  local-narratives:
    name: Offline narrative contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check translation bounds, literal preservation and model integrity contracts
        run: python -m unittest discover -s api/local-forensics -p test_translation_engine.py

  app:
    name: Flutter tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

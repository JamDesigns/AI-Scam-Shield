<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Policy – AI Scam Shield</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var supportedLocales = ['en', 'es', 'fr', 'de', 'it'];
      var languages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || 'en'];

      var selectedLocale = 'en';

      for (var i = 0; i < languages.length; i++) {
        var locale = String(languages[i]).toLowerCase().split('-')[0];

        if (supportedLocales.indexOf(locale) !== -1) {
          selectedLocale = locale;
          break;
        }
      }

      window.location.replace('legal/privacy-policy.' + selectedLocale + '.html');
    })();
  </script>
</head>
<body>
  <p>
    Redirecting to the Privacy Policy.
    <a href="legal/privacy-policy.en.html">English</a> ·
    <a href="legal/privacy-policy.es.html">Español</a> ·
    <a href="legal/privacy-policy.fr.html">Français</a> ·
    <a href="legal/privacy-policy.de.html">Deutsch</a> ·
    <a href="legal/privacy-policy.it.html">Italiano</a>
  </p>
</body>
</html>

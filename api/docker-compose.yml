name: api_scam_shield

services:
  postgres:
    container_name: api_scam_shield_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scam
      POSTGRES_PASSWORD: scam
      POSTGRES_DB: scam_shield
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scam -d scam_shield"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    container_name: api_scam_shield_api
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
    name: api_scam_shield_pgdata
